[package]
name = "yatima-cli"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[[bin]]
name = "yatima"
path = "src/main.rs"

[dependencies]
yatima-lib = { path = "../lib" }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rustyline = { version = "18.0.1", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "process", "sync", "time"] }
tempfile = "3"

[features]
default = ["fetch"]
fetch = ["yatima-lib/fetch"]
metal = ["yatima-lib/metal"]
