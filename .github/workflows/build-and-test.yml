name: build and test
on:
  push:
  pull_request:
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"   # HTTP/1.1; sidesteps the crates.io HTTP/2 framing flake
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: SebRollen/toml-action@v1.0.2
      id: read_rust_toolchain
      with:
        file: rust-toolchain
        field: toolchain.channel
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ steps.read_rust_toolchain.outputs.value }}
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: shared-build-cache
        cache-targets: true
        cache-all-crates: true
    - name: format check
      run: cargo fmt --all --check
    - name: clippy check
      run: cargo clippy --all-targets
    # web is excluded from the workspace (wasm32-only crate), so the checks
    # above skip it; run its native lints explicitly on the transcript model.
    - name: web format check
      run: cargo fmt --manifest-path web/Cargo.toml --all --check
    - name: web clippy check
      run: cargo clippy --manifest-path web/Cargo.toml --all-targets
    - name: build
      run: cargo build
    - name: wasm check (WASM-1)
      run: ./scripts/check-wasm.sh
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - uses: SebRollen/toml-action@v1.0.2
      id: read_rust_toolchain
      with:
        file: rust-toolchain
        field: toolchain.channel
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ steps.read_rust_toolchain.outputs.value }}
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: shared-build-cache
        cache-targets: true
        cache-all-crates: true
    - name: run tests
      run: cargo test
    # web is excluded from the workspace; its transcript model is unit-tested
    # natively (the wasm view is compile-checked in the build job).
    - name: run web tests
      run: cargo test --manifest-path web/Cargo.toml
  publish-docs:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - uses: SebRollen/toml-action@v1.0.2
      id: read_rust_toolchain
      with:
        file: rust-toolchain
        field: toolchain.channel
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ steps.read_rust_toolchain.outputs.value }}
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: shared-build-cache
        cache-targets: true
        cache-all-crates: true
    - uses: actions/configure-pages@v5
      with:
        enablement: true
    - name: build docs
      run: cargo doc --workspace --no-deps
    - name: disable jekyll
      run: touch target/doc/.nojekyll
    - name: copy logo
      run: cp images/yatima-3.png target/doc/yatima-3.png
    - name: create workspace index
      run: |
        cat > target/doc/index.html <<'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>yatima — documentation</title>
          <style>
            html { box-sizing: border-box; }
            *, *::before, *::after { box-sizing: inherit; }
            body { padding: 2rem; max-width: 900px; margin: 0 auto;
                   font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Helvetica, Arial, sans-serif; color: #1f2328; }
            h1 { border-bottom: 1px solid #d0d7de; padding-bottom: 0.5rem; }
            .header-section { display: flex; align-items: center; gap: 2rem;
                              margin-bottom: 2rem; }
            .artwork { width: 200px; height: auto; border-radius: 8px; }
            .header-text { flex: 1; min-width: 0; }
            .github-link { display: inline-flex; align-items: center; gap: 0.5rem;
                           padding: 0.5rem 1rem; background: #24292e; color: #fff;
                           text-decoration: none; border-radius: 6px;
                           font-weight: 500; margin-top: 1rem; }
            .github-link:hover { background: #1b1f23; }
            .quick-links { background: #f6f8fa; padding: 1.5rem;
                           border-radius: 6px; margin: 2rem 0; }
            .quick-links h2 { margin-top: 0; }
            .quick-links ul { margin: 0.5rem 0; }
            .crate-list { list-style: none; padding: 0; }
            .crate-list li { margin: 1.5rem 0; padding: 1rem;
                             border: 1px solid #d0d7de; border-radius: 4px; }
            .crate-list h2 { margin: 0 0 0.25rem; font-size: 1.1rem; }
            a { color: #0969da; text-decoration: none; }
            a:hover { text-decoration: underline; }
            footer { margin-top: 3rem; padding-top: 2rem;
                     border-top: 1px solid #d0d7de; color: #57606a;
                     font-size: 0.875rem; text-align: center; }
            @media (max-width: 600px) {
              .header-section { flex-direction: column; align-items: stretch; }
              .artwork { width: 150px; align-self: center; }
            }
          </style>
        </head>
        <body>
          <div class="header-section">
            <img src="yatima-3.png" alt="yatima artwork" class="artwork">
            <div class="header-text">
              <h1>yatima</h1>
              <p>Local language models inside typed Rust programs.</p>
              <a href="https://github.com/shayne-fletcher/yatima" class="github-link">
                <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                  <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
                View on GitHub
              </a>
            </div>
          </div>
          <div class="quick-links">
            <h2>Quick Links</h2>
            <ul>
              <li><a href="https://github.com/shayne-fletcher/yatima">Source Repository</a></li>
              <li><a href="https://github.com/shayne-fletcher/yatima/blob/main/README.md">README</a></li>
              <li><a href="https://github.com/shayne-fletcher/yatima/blob/main/LICENSE">License</a> (BSD-3-Clause)</li>
            </ul>
          </div>
          <h2>Crates</h2>
          <ul class="crate-list">
            <li>
              <h2><a href="yatima_lib/index.html">yatima-lib</a></h2>
              <p>Model backends, generation, transcripts, tools, and the agent protocol.</p>
            </li>
            <li>
              <h2><a href="yatima_protocol/index.html">yatima-protocol</a></h2>
              <p>Serializable request and event meanings shared across process and frontend boundaries.</p>
            </li>
            <li>
              <h2><a href="yatima_text/index.html">yatima-text</a></h2>
              <p>Pure output prettification shared by native and browser views.</p>
            </li>
            <li>
              <h2><a href="yatima_host/index.html">yatima-host</a></h2>
              <p>The engine thread, authoritative session, and request, event, and control planes.</p>
            </li>
            <li>
              <h2><a href="yatima/index.html">yatima-cli</a></h2>
              <p>The <code>yatima</code> command-line frontend for generation, chat, and agents.</p>
            </li>
            <li>
              <h2><a href="yatima_tui/index.html">yatima-tui</a></h2>
              <p>The terminal frontend and its local interaction state.</p>
            </li>
            <li>
              <h2><a href="yatima_gui/index.html">yatima-gui</a></h2>
              <p>The native egui/wgpu frontend.</p>
            </li>
            <li>
              <h2><a href="yatima_serve/index.html">yatima-serve</a></h2>
              <p>The WebSocket lease and bridge between browser clients and the host planes.</p>
            </li>
          </ul>
          <footer>
            Copyright © 2026 Shayne Fletcher. Licensed under
            <a href="https://github.com/shayne-fletcher/yatima/blob/main/LICENSE">BSD-3-Clause</a>.
          </footer>
        </body>
        </html>
        EOF
    - name: upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: target/doc
    - name: deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
