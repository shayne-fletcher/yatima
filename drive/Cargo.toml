[package]
name = "yatima-drive"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

# The headless scenario driver's library: the request/event flight recorder
# (D0/D0.5) and, next, the scenario runner (D1). Images are stored out of line;
# this crate depends on yatima-protocol for the wire shapes and stays free of
# frontend machinery.
[dependencies]
yatima-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros"] }
